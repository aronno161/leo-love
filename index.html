<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love Leo</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }
  canvas {
    display: block;
    background: #000;
  }
  #replayBtn {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 22px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,80,120,0.6);
    color: #ff9db8;
    font-family: Arial, sans-serif;
    font-size: 14px;
    border-radius: 30px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.6s ease;
    letter-spacing: 1px;
    backdrop-filter: blur(4px);
  }
  #replayBtn.show { opacity: 1; }
  #replayBtn:hover { background: rgba(255,80,120,0.2); }
  #soundBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,80,120,0.6);
    color: #ff9db8;
    font-family: Arial, sans-serif;
    font-size: 13px;
    border-radius: 30px;
    cursor: pointer;
    letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  #soundBtn:hover { background: rgba(255,80,120,0.2); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="bgSong" src="song.mp3" loop preload="auto"></audio>
<button id="soundBtn">🔊 Enable Sound</button>
<button id="replayBtn">Replay ✨</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const replayBtn = document.getElementById('replayBtn');
const soundBtn = document.getElementById('soundBtn');
let W, H, cx, cy;

// ---------- Audio engine (synthesized, no files needed) ----------
let audioCtx = null;
let masterGain = null;
let soundEnabled = false;
let ambientNodes = [];
let sparkleTimer = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.35;
  masterGain.connect(audioCtx.destination);
}

// Whoosh: filtered noise sweeping upward in pitch, matches WARP_DURATION
function playWhoosh(duration) {
  const bufferSize = audioCtx.sampleRate * (duration / 1000);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.Q.value = 0.8;
  filter.frequency.setValueAtTime(300, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(3500, audioCtx.currentTime + duration / 1000);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.5, audioCtx.currentTime + 0.4);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration / 1000);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  noise.start();
  noise.stop(audioCtx.currentTime + duration / 1000);
}

// Chime: soft ascending notes for the convergence into a heart
function playChime() {
  const notes = [523.25, 659.25, 783.99, 987.77]; // C5 E5 G5 B5
  notes.forEach((freq, i) => {
    const t0 = audioCtx.currentTime + i * 0.28;
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + 1.3);
  });
}

// Ambient pad + sparkle blips for the hold phase (heart formed)
function startAmbient() {
  stopAmbient();
  const freqs = [261.63, 329.63]; // soft C+E pad
  freqs.forEach(f => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    const g = audioCtx.createGain();
    g.gain.value = 0.05;
    osc.connect(g);
    g.connect(masterGain);
    osc.start();
    ambientNodes.push({ osc, g });
  });

  function sparkleBlip() {
    if (!soundEnabled) return;
    const freq = 1200 + Math.random() * 1600;
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    const t0 = audioCtx.currentTime;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + 0.4);
    sparkleTimer = setTimeout(sparkleBlip, 250 + Math.random() * 500);
  }
  sparkleBlip();
}

function stopAmbient() {
  ambientNodes.forEach(n => {
    try { n.osc.stop(); } catch(e) {}
  });
  ambientNodes = [];
  if (sparkleTimer) clearTimeout(sparkleTimer);
  sparkleTimer = null;
}

const bgSong = document.getElementById('bgSong');
bgSong.volume = 0.45;

soundBtn.addEventListener('click', () => {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? '🔇 Mute Sound' : '🔊 Enable Sound';
  if (soundEnabled) {
    bgSong.currentTime = 0;
    bgSong.play().catch(err => console.log('Song play blocked:', err));
  } else {
    bgSong.pause();
    stopAmbient();
  }
});

// ---------- Try autoplay immediately; fall back to first click anywhere ----------
function enableSoundNow() {
  if (soundEnabled) return;
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  soundEnabled = true;
  soundBtn.textContent = '🔇 Mute Sound';
  bgSong.play().catch(err => console.log('Song play blocked:', err));
}

// Attempt autoplay right away (works in some browsers/contexts)
window.addEventListener('load', () => {
  bgSong.play().then(() => {
    soundEnabled = true;
    soundBtn.textContent = '🔇 Mute Sound';
  }).catch(() => {
    // Autoplay blocked — wait for the very first user interaction anywhere on the page
    const onFirstInteract = () => {
      enableSoundNow();
      document.removeEventListener('click', onFirstInteract);
      document.removeEventListener('touchstart', onFirstInteract);
      document.removeEventListener('keydown', onFirstInteract);
    };
    document.addEventListener('click', onFirstInteract);
    document.addEventListener('touchstart', onFirstInteract);
    document.addEventListener('keydown', onFirstInteract);
  });
});

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// ---------- Heart shape target points ----------
function heartPoint(t, scale) {
  // classic parametric heart curve
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return { x: x * scale, y: -y * scale };
}

const PARTICLE_COUNT = 420;
let particles = [];

function createParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const angle = Math.random() * Math.PI * 2;
    particles.push({
      // warp field state
      angle: angle,
      radius: Math.random() * 6 + 1,      // start near center
      speed: Math.random() * 2 + 1.5,
      z: Math.random() * 1 + 0.3,
      size: Math.random() * 1.6 + 0.6,
      // heart target
      t: (i / PARTICLE_COUNT) * Math.PI * 2,
      hx: 0, hy: 0,
      // twinkle
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.08 + 0.02,
      color: pickColor()
    });
  }
  // compute heart target positions, scaled to fit screen nicely
  const scale = Math.min(W, H) / 34;
  particles.forEach((p, i) => {
    const t = (i / PARTICLE_COUNT) * Math.PI * 2;
    const jitter = (Math.random() - 0.5) * 0.6; // slight scatter for organic feel
    const pt = heartPoint(t, scale + jitter);
    p.hx = cx + pt.x;
    p.hy = cy + pt.y - 10;
  });
}

function pickColor() {
  const colors = ['#ffffff', '#ffe3ec', '#ffd1e0', '#ff9db8', '#ffffff', '#cfe8ff'];
  return colors[Math.floor(Math.random() * colors.length)];
}

createParticles();

// ---------- Animation timeline ----------
// Phase A: warp-speed star zoom (0 -> WARP_DURATION)
// Phase B: transition / converge to heart (WARP_DURATION -> WARP_DURATION+TRANSITION_DURATION)
// Phase C: heart formed, holding with twinkle + text reveal
const WARP_DURATION = 3600;        // ms
const TRANSITION_DURATION = 2200;  // ms
const HOLD_START = WARP_DURATION + TRANSITION_DURATION;

let startTime = null;
let textOpacity = 0;
let running = true;
let currentPhase = null; // 'warp' | 'transition' | 'hold'

function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

function drawBackgroundGlow(progressToHeart) {
  // subtle vignette / glow that intensifies as heart forms
  const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * 0.7);
  grad.addColorStop(0, `rgba(255,90,130,${0.10 * progressToHeart})`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function frame(now) {
  if (!startTime) startTime = now;
  const elapsed = now - startTime;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 0, W, H);

  if (elapsed < WARP_DURATION) {
    // ---------- PHASE A: warp zoom ----------
    if (currentPhase !== 'warp') {
      currentPhase = 'warp';
    }
    const speedMul = 1 + (elapsed / WARP_DURATION) * 5;
    particles.forEach(p => {
      p.radius += p.speed * speedMul * 0.9;
      p.twinkle += p.twinkleSpeed;
      let r = p.radius;
      let maxR = Math.hypot(W, H) / 2 + 50;
      if (r > maxR) {
        p.radius = Math.random() * 4 + 1;
        p.angle = Math.random() * Math.PI * 2;
      }
      const x = cx + Math.cos(p.angle) * p.radius;
      const y = cy + Math.sin(p.angle) * p.radius;
      const trailLen = Math.min(p.radius * 0.12 * (speedMul * 0.4), 40);
      const tx = cx + Math.cos(p.angle) * (p.radius - trailLen);
      const ty = cy + Math.sin(p.angle) * (p.radius - trailLen);

      const alpha = Math.min(1, p.radius / 80) * (0.6 + 0.4 * Math.sin(p.twinkle));
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = p.size;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.globalAlpha = 1;

      p.curX = x; p.curY = y;
    });
  } else if (elapsed < HOLD_START) {
    // ---------- PHASE B: converge into heart ----------
    if (currentPhase !== 'transition') {
      currentPhase = 'transition';
    }
    const localT = (elapsed - WARP_DURATION) / TRANSITION_DURATION;
    const eased = easeInOutCubic(Math.min(localT, 1));
    drawBackgroundGlow(eased);

    particles.forEach(p => {
      if (p.curX === undefined) { p.curX = cx; p.curY = cy; }
      const nx = p.curX + (p.hx - p.curX) * (0.06 + eased * 0.12);
      const ny = p.curY + (p.hy - p.curY) * (0.06 + eased * 0.12);
      p.curX = nx;
      p.curY = ny;
      p.twinkle += p.twinkleSpeed;

      const alpha = 0.5 + 0.5 * Math.sin(p.twinkle);
      const size = p.size + eased * 1.4;

      ctx.beginPath();
      ctx.arc(nx, ny, size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.shadowColor = '#ff6f91';
      ctx.shadowBlur = 8 * eased;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    });
  } else {
    // ---------- PHASE C: heart formed, hold + twinkle ----------
    if (currentPhase !== 'hold') {
      currentPhase = 'hold';
    }
    drawBackgroundGlow(1);
    particles.forEach(p => {
      p.twinkle += p.twinkleSpeed;
      const wobbleX = Math.sin(p.twinkle * 0.5) * 0.6;
      const wobbleY = Math.cos(p.twinkle * 0.5) * 0.6;
      const alpha = 0.55 + 0.45 * Math.sin(p.twinkle);

      ctx.beginPath();
      ctx.arc(p.hx + wobbleX, p.hy + wobbleY, p.size + 1.2, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.shadowColor = '#ff6f91';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    });

    // fade in text
    if (textOpacity < 1) textOpacity += 0.02;
    ctx.save();
    ctx.globalAlpha = textOpacity;
    const fontSize = Math.max(24, Math.min(W, H) * 0.06);
    ctx.font = `bold ${fontSize}px Georgia, 'Times New Roman', serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ff6f91';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('I Love Leo', cx, cy + Math.min(W, H) * 0.02);
    ctx.restore();

    if (textOpacity >= 1 && !replayBtn.classList.contains('show')) {
      replayBtn.classList.add('show');
    }
  }

  if (running) requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

replayBtn.addEventListener('click', () => {
  startTime = null;
  textOpacity = 0;
  currentPhase = null;
  stopAmbient();
  if (soundEnabled) {
    bgSong.currentTime = 0;
    bgSong.play().catch(err => console.log('Song play blocked:', err));
  }
  replayBtn.classList.remove('show');
  createParticles();
});
</script>
</body>
</html>
